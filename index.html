<script>
const STORE_KEY='match_manager_v1';
const titles={dashboard:'داشبورد مدیریتی',sales:'ثبت و سوابق فروش',inventory:'انبار و کالاها',purchases:'خرید و تأمین کالا',expenses:'ثبت هزینه‌ها',cards:'کارت‌ها و تقسیم پول',allocations:'سهم‌بندی فروش‌ها',reports:'گزارش سود و زیان',settings:'تنظیمات و پشتیبان‌گیری'};
const today=new Date();
const newDB=()=>({products:[],sales:[],purchases:[],expenses:[],cards:[],settings:{businessName:'مدیریت فروش',currency:'تومان'}});
let db=loadDB(), currentView='dashboard', modalSubmit=null, searchTerm='';
function loadDB(){try{return {...newDB(),...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')};}catch(e){return newDB();}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(db));}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function num(v){return Number(v)||0}
function money(v){return new Intl.NumberFormat('fa-IR').format(Math.round(num(v)))+' تومان'}
function compactMoney(v){return new Intl.NumberFormat('fa-IR',{notation:'compact',maximumFractionDigits:1}).format(Math.round(num(v)))}
function faDate(d){return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(d))}
function localDateTimeValue(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}
function faTime(d){return new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function dateKey(d){let x=new Date(d);return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`}
function isToday(d){return dateKey(d)===dateKey(new Date())}
function isThisMonth(d){let x=new Date(d),n=new Date();return x.getMonth()===n.getMonth()&&x.getFullYear()===n.getFullYear()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={sale:'<path d="M4 4h2l2.2 11.5a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H7"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',profit:'<path d="M3 17 9 11l4 4 8-9"/><path d="M15 6h6v6"/>',box:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v9l9 5 9-5V8M12 13v9"/>',wallet:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M3 10h18M16 15h.01"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m16 4 4 4L9 19l-5 1 1-5L16 4Z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.plus}</svg>`}
function setView(view){currentView=view;searchTerm='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('topTitle').textContent=titles[view]||'مدیریت فروش';document.querySelector('.crumb-sub').textContent=view==='dashboard'?'نمای کلی عملکرد و وضعیت مالی فروش':'مدیریت اطلاعات فروش';document.getElementById('sidebar').classList.remove('open');render()}
function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}
function getProduct(id){return db.products.find(p=>p.id===id)}
function totalSales(list=db.sales){return sum(list,s=>s.total)}
function totalCost(list=db.sales){return sum(list,s=>s.cost)}
function totalProfit(list=db.sales){return sum(list,s=>s.profit)}
function totalExpenses(list=db.expenses){return sum(list,e=>e.amount)}
function netProfit(sales,expenses){return totalProfit(sales)-totalExpenses(expenses)}
function saleAllocations(sale){return sale.allocations||[]}
function allAllocations(){return db.sales.flatMap(s=>saleAllocations(s).map(a=>({...a,saleId:s.id,saleDate:s.date,saleTotal:s.total})))}
function allocationPercents(basis,excludeId=null){return sum(db.cards.filter(c=>c.basis===basis&&c.id!==excludeId),c=>c.percent)}
function makeAllocations(total,profit){return db.cards.map(c=>({cardId:c.id,cardName:c.name,purpose:c.purpose,basis:c.basis,percent:c.percent,amount:Math.round(Math.max(0,c.basis==='sales'?total:profit)*c.percent/100),transferred:false,transferredAt:null}))}
function render(){const root=document.getElementById('content');if(currentView==='dashboard')root.innerHTML=dashboardView();if(currentView==='sales')root.innerHTML=salesView();if(currentView==='inventory')root.innerHTML=inventoryView();if(currentView==='purchases')root.innerHTML=purchasesView();if(currentView==='expenses')root.innerHTML=expensesView();if(currentView==='cards')root.innerHTML=cardsView();if(currentView==='allocations')root.innerHTML=allocationsView();if(currentView==='reports')root.innerHTML=reportsView();if(currentView==='settings')root.innerHTML=settingsView();bindViewEvents();}
function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function kpi(label,value,kind,ico,foot){return `<div class="kpi ${kind}"><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${icon(ico)}</span></div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div>`}
function dashboardView(){const ms=db.sales.filter(s=>isThisMonth(s.date)),me=db.expenses.filter(e=>isThisMonth(e.date)),todaySales=db.sales.filter(s=>isToday(s.date));const pending=sum(allAllocations().filter(a=>!a.transferred),a=>a.amount);const inventoryValue=sum(db.products,p=>p.stock*p.costPrice);const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return{d,amount:sum(db.sales.filter(s=>dateKey(s.date)===dateKey(d)),s=>s.total)}});const max=Math.max(1,...days.map(x=>x.amount));const recent=[...db.sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);const low=db.products.filter(p=>p.stock<=p.minStock).slice(0,5);const cardRules=db.cards;const groups=['sales','profit'];const colors=['#28b68c','#5f91f4','#eda94a','#9a83db','#ed7c88','#51b6c4'];let baseSales=sum(cardRules.filter(c=>c.basis==='sales'),c=>c.percent),baseProfit=sum(cardRules.filter(c=>c.basis==='profit'),c=>c.percent);return `${pageHead('خلاصه وضعیت فروش','نمای کلی')}<div class="grid kpis">${kpi('فروش این ماه',money(totalSales(ms)),'green','sale',`${new Intl.NumberFormat('fa-IR').format(ms.length)} فاکتور ثبت‌شده`)}${kpi('سود ناخالص این ماه',money(totalProfit(ms)),'blue','profit','فروش منهای بهای کالای فروخته‌شده')}${kpi('سود پس از هزینه‌ها',money(netProfit(ms,me)),netProfit(ms,me)>=0?'orange':'red','wallet',`هزینه‌های ثبت‌شده: ${money(totalExpenses(me))}`)}${kpi('ارزش تقریبی موجودی',money(inventoryValue),'red','box',`تعداد ${new Intl.NumberFormat('fa-IR').format(db.products.length)} قلم کالا`)}</div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><h3>روند فروش در ۷ روز اخیر</h3><span>مجموع فروش روزانه</span></div><div class="chart-area">${days.map(x=>`<div class="chart-col"><div class="chart-bar-wrap"><div class="chart-bar" style="height:${Math.max(x.amount?5:2,x.amount/max*100)}%" title="${money(x.amount)}"></div></div><span class="chart-day">${new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(x.d)}</span></div>`).join('')}</div><div class="chart-note">فروش امروز: <b>${money(totalSales(todaySales))}</b></div></section><section class="allocation-card"><div class="panel-head"><h3>پول‌های سهم‌بندی‌شده</h3><span>وضعیت انتقال</span></div><div class="alloc-total">${money(pending)}</div><div class="alloc-sub">مبلغی که طبق قوانین کارت‌ها محاسبه شده اما هنوز انتقال آن را تأیید نکرده‌ای</div><div class="alloc-progress">${allAllocations().length?`<span style="width:${Math.min(100,sum(allAllocations().filter(a=>a.transferred),a=>a.amount)/Math.max(1,sum(allAllocations(),a=>a.amount))*100)}%;background:#2cc293"></span><span style="flex:1;background:#ffffff25"></span>`:''}</div><div class="alloc-legend"><div class="alloc-row"><span class="alloc-left"><i class="dot" style="background:#2cc293"></i>انتقال‌داده‌شده</span><strong>${money(sum(allAllocations().filter(a=>a.transferred),a=>a.amount))}</strong></div><div class="alloc-row"><span class="alloc-left"><i class="dot" style="background:#fff6"></i>در انتظار انتقال</span><strong>${money(pending)}</strong></div><div class="alloc-row"><span class="alloc-left"><i class="dot" style="background:#8eb2ff"></i>درصد تعریف‌شده از فروش</span><strong>${new Intl.NumberFormat('fa-IR').format(baseSales)}٪</strong></div></div></section></div><div class="grid lower-grid"><section class="panel"><div class="panel-head"><h3>آخرین فروش‌ها</h3><button class="action-link" data-go="sales">مشاهده همه فروش‌ها ←</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>شرح فروش</th><th>تاریخ</th><th>مبلغ</th><th>سود</th></tr></thead><tbody>${recent.map(s=>`<tr><td><b>${esc(s.items.map(i=>i.name).join('، '))}</b></td><td>${faDate(s.date)}</td><td>${money(s.total)}</td><td class="amount-positive">${money(s.profit)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>هنوز فروشی ثبت نشده</strong>با ثبت اولین فروش، گزارش‌ها و نمودارها اینجا نمایش داده می‌شوند.</div>`}</section><section class="panel"><div class="panel-head"><h3>هشدار موجودی کالا</h3><button class="action-link" data-go="inventory">مدیریت انبار ←</button></div>${low.length?`<div class="stock-list">${low.map(p=>`<div class="stock-item"><div class="stock-info"><div class="product-avatar">${esc(p.name.slice(0,1))}</div><div class="stock-item-wrap"><b>${esc(p.name)}</b><div class="stock-line"><span style="width:${Math.min(100,p.stock/Math.max(1,p.minStock)*100)}%;background:${p.stock===0?'#df5c65':'#e6a23c'}"></span></div></div></div><span class="status ${p.stock===0?'bad':'warn'}">${new Intl.NumberFormat('fa-IR').format(p.stock)} ${esc(p.unit)}</span></div>`).join('')}</div>`:`<div class="empty"><strong>وضعیت انبار خوب است</strong>کالایی زیر حداقل موجودی تعریف‌شده نیست.</div>`}</section></div><div class="footer-note">مبالغ به تومان هستند · اطلاعات در مرورگر همین دستگاه ذخیره می‌شوند.</div>`}
function salesView(){const rows=[...db.sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(s=>!searchTerm||s.items.some(i=>i.name.includes(searchTerm)));return `${pageHead('سوابق فروش','هر فروش را ثبت کن تا موجودی، سود و سهم کارت‌ها به‌صورت خودکار به‌روزرسانی شود.','<button class="btn btn-primary" data-action="new-sale">'+icon('plus')+'ثبت فروش جدید</button>')}<div class="panel"><div class="panel-head"><h3>فاکتورهای فروش</h3><div class="toolbar"><div class="search"><input id="tableSearch" placeholder="جست‌وجوی کالا در فاکتورها..." value="${esc(searchTerm)}"></div><span class="tiny">${new Intl.NumberFormat('fa-IR').format(rows.length)} فاکتور</span></div></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>شماره</th><th>اقلام فروخته‌شده</th><th>تاریخ و ساعت</th><th>مبلغ فروش</th><th>بهای کالا</th><th>سود ناخالص</th><th>روش پرداخت</th><th>عملیات</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>#${new Intl.NumberFormat('fa-IR').format(rows.length-i)}</td><td><b>${esc(s.items.map(x=>x.name+' × '+x.qty).join('، '))}</b></td><td>${faDate(s.date)} · ${faTime(s.date)}</td><td><b>${money(s.total)}</b></td><td>${money(s.cost)}</td><td class="amount-positive">${money(s.profit)}</td><td>${esc(s.payment||'نقدی')}</td><td><button class="btn btn-danger btn-small" data-delete-sale="${s.id}">حذف</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>فاکتوری برای نمایش وجود ندارد</strong>ثبت فروش جدید را بزن و اولین فاکتور را وارد کن.</div>`}</div>`}
function inventoryView(){const products=db.products.filter(p=>!searchTerm||p.name.includes(searchTerm));return `${pageHead('انبار و کالاها','تعریف کالا، قیمت خرید و فروش، موجودی و حد هشدار کمبود.','<button class="btn btn-primary" data-action="new-product">'+icon('plus')+'افزودن کالا</button>')}<div class="grid kpis">${kpi('تعداد انواع کالا',new Intl.NumberFormat('fa-IR').format(db.products.length),'blue','box','کالاهای تعریف‌شده')}${kpi('مجموع تعداد موجودی',new Intl.NumberFormat('fa-IR').format(sum(db.products,p=>p.stock)),'green','profit','جمع تعداد همه واحدها')}${kpi('ارزش بهای موجودی',money(sum(db.products,p=>p.stock*p.costPrice)),'orange','wallet','بر اساس میانگین بهای خرید')}${kpi('کالاهای نیازمند شارژ',new Intl.NumberFormat('fa-IR').format(db.products.filter(p=>p.stock<=p.minStock).length),'red','sale','رسیده به حد هشدار یا کمتر')}</div><div class="panel"><div class="panel-head"><h3>فهرست کالاها</h3><div class="toolbar"><div class="search"><input id="tableSearch" placeholder="نام کالا را جست‌وجو کن..." value="${esc(searchTerm)}"></div></div></div>${products.length?`<div class="table-wrap"><table><thead><tr><th>نام کالا</th><th>موجودی فعلی</th><th>حد هشدار</th><th>میانگین بهای خرید</th><th>قیمت فروش</th><th>سود هر واحد</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="product-cell"><div class="product-avatar">${esc(p.name.slice(0,1))}</div><b>${esc(p.name)}</b></div></td><td><b>${new Intl.NumberFormat('fa-IR').format(p.stock)} ${esc(p.unit)}</b></td><td>${new Intl.NumberFormat('fa-IR').format(p.minStock)} ${esc(p.unit)}</td><td>${money(p.costPrice)}</td><td>${money(p.sellPrice)}</td><td class="${p.sellPrice-p.costPrice>=0?'amount-positive':'amount-negative'}">${money(p.sellPrice-p.costPrice)}</td><td><span class="status ${p.stock<=p.minStock?(p.stock===0?'bad':'warn'):'good'}">${p.stock===0?'ناموجود':p.stock<=p.minStock?'رو به اتمام':'موجود'}</span></td><td><div class="actions"><button class="btn btn-soft btn-small" data-edit-product="${p.id}">ویرایش</button><button class="btn btn-danger btn-small" data-delete-product="${p.id}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>هنوز کالایی تعریف نکرده‌ای</strong>برای شروع، کالاهای کبریت و واحد فروش آن‌ها را اضافه کن. بعد از آن می‌توانی خرید و فروش را ثبت کنی.</div>`}</div>`}
function purchasesView(){const rows=[...db.purchases].sort((a,b)=>new Date(b.date)-new Date(a.date));return `${pageHead('خرید و تأمین کالا','با ثبت خرید، موجودی انبار زیاد و میانگین بهای خرید کالا به‌روزرسانی می‌شود.','<button class="btn btn-primary" data-action="new-purchase">'+icon('plus')+'ثبت خرید کالا</button>')}<div class="grid kpis">${kpi('تعداد دفعات خرید',new Intl.NumberFormat('fa-IR').format(rows.length),'blue','box','خریدهای ثبت‌شده')}${kpi('مجموع مبلغ خریدها',money(sum(rows,p=>p.total)),'orange','wallet','مجموع ارزش خرید')}${kpi('تعداد واحد خریداری‌شده',new Intl.NumberFormat('fa-IR').format(sum(rows,p=>p.qty)),'green','profit','جمع تعداد اقلام')}</div><div class="panel"><div class="panel-head"><h3>تاریخچه خریدها</h3></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>کالا</th><th>تاریخ</th><th>تعداد</th><th>قیمت خرید واحد</th><th>مبلغ کل</th><th>توضیحات</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.productName)}</b></td><td>${faDate(p.date)}</td><td>${new Intl.NumberFormat('fa-IR').format(p.qty)} ${esc(p.unit)}</td><td>${money(p.unitCost)}</td><td><b>${money(p.total)}</b></td><td>${esc(p.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>هنوز خریدی ثبت نشده</strong>با ثبت خرید، موجودی و بهای تمام‌شده کالا خودکار به‌روزرسانی می‌شود.</div>`}</div>`}
function expensesView(){const rows=[...db.expenses].sort((a,b)=>new Date(b.date)-new Date(a.date));return `${pageHead('هزینه‌های فروش','هزینه‌های جاری را ثبت کن تا سود خالص  محاسبه شود.','<button class="btn btn-primary" data-action="new-expense">'+icon('plus')+'ثبت هزینه</button>')}<div class="grid kpis">${kpi('مجموع هزینه‌ها',money(totalExpenses(rows)),'red','wallet','تمام هزینه‌های ثبت‌شده')}${kpi('هزینه‌های این ماه',money(totalExpenses(rows.filter(e=>isThisMonth(e.date)))),'orange','calendar','از ابتدای ماه جاری')}${kpi('تعداد ثبت هزینه',new Intl.NumberFormat('fa-IR').format(rows.length),'blue','box','رسیدها و پرداخت‌ها')}</div><div class="panel"><div class="panel-head"><h3>دفتر هزینه‌ها</h3></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>عنوان / دسته</th><th>تاریخ</th><th>مبلغ</th><th>توضیحات</th><th>عملیات</th></tr></thead><tbody>${rows.map(e=>`<tr><td><b>${esc(e.category)}</b></td><td>${faDate(e.date)}</td><td class="amount-negative">${money(e.amount)}</td><td>${esc(e.note||'—')}</td><td><button class="btn btn-danger btn-small" data-delete-expense="${e.id}">حذف</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>هزینه‌ای ثبت نشده</strong>کرایه، حمل‌ونقل، حقوق، بسته‌بندی و سایر مخارج را اینجا وارد کن.</div>`}</div>`}
function cardsView(){const totalSalesPct=allocationPercents('sales'),totalProfitPct=allocationPercents('profit');return `${pageHead('کارت‌ها و قوانین تقسیم پول','برای هر کارت، نام و کاربردش را مشخص کن؛ سپس درصدی از فروش یا سود به آن اختصاص بده.','<button class="btn btn-primary" data-action="new-card">'+icon('plus')+'تعریف کارت جدید</button>')}<div class="warning-box">این بخش مبلغ سهم هر کارت را محاسبه و برایت فهرست می‌کند؛ انتقال واقعی وجه به کارت بانکی انجام نمی‌دهد. انتقال را بعد از انجام در بانک، در بخش «سهم‌بندی فروش‌ها» تأیید کن.</div>${db.cards.length?`<div class="grid card-grid">${db.cards.map(c=>`<div><div class="bank-card"><div class="card-top"><span>مقصد تخصیص وجه</span>${icon('wallet')}</div><div class="card-name">${esc(c.name)}</div><div class="card-purpose">${esc(c.purpose)}</div><div class="card-percent">${new Intl.NumberFormat('fa-IR').format(c.percent)}٪</div><div class="card-basis">از ${c.basis==='sales'?'کل مبلغ فروش':'سود ناخالص فروش'}</div></div><div class="bank-card-actions"><button data-edit-card="${c.id}">ویرایش قانون</button><button data-delete-card="${c.id}">حذف</button></div></div>`).join('')}</div>`:`<div class="panel"><div class="empty"><strong>هنوز کارتی تعریف نکرده‌ای</strong>مثلاً کارت «سرمایه خرید جنس»، «پس‌انداز»، «هزینه جاری» یا هر مقصد دیگری را اضافه کن.</div></div>`}<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:17px"><div class="rule-group"><div class="rule-group-head"><span>تقسیم از کل مبلغ فروش</span><span class="rule-total">${new Intl.NumberFormat('fa-IR').format(totalSalesPct)}٪ از ۱۰۰٪</span></div><div class="rule-bar"><span style="width:${Math.min(100,totalSalesPct)}%"></span></div><p class="tiny">درصد باقی‌مانده: ${new Intl.NumberFormat('fa-IR').format(Math.max(0,100-totalSalesPct))}٪</p></div><div class="rule-group"><div class="rule-group-head"><span>تقسیم از سود ناخالص</span><span class="rule-total">${new Intl.NumberFormat('fa-IR').format(totalProfitPct)}٪ از ۱۰۰٪</span></div><div class="rule-bar"><span style="width:${Math.min(100,totalProfitPct)}%"></span></div><p class="tiny">درصد باقی‌مانده: ${new Intl.NumberFormat('fa-IR').format(Math.max(0,100-totalProfitPct))}٪</p></div></div><div class="hint" style="margin-top:14px">مثال: اگر کارت «خرید جنس» را روی ۴۰٪ از کل فروش تنظیم کنی، با ثبت فروش ۱٬۰۰۰٬۰۰۰ تومانی، مبلغ ۴۰۰٬۰۰۰ تومان برای آن کارت محاسبه می‌شود. کارت‌های مبتنی بر سود، بر اساس سود ناخالص همان فاکتور محاسبه می‌شوند.</div>`}
function allocationsView(){const rows=allAllocations().sort((a,b)=>new Date(b.saleDate)-new Date(a.saleDate));const pending=sum(rows.filter(a=>!a.transferred),a=>a.amount),done=sum(rows.filter(a=>a.transferred),a=>a.amount);return `${pageHead('سهم‌بندی و انتقال وجه','بعد از هر فروش، سهم کارت‌ها اینجا ثبت می‌شود. بعد از انتقال بانکی، وضعیت را تأیید کن.')}<div class="grid kpis">${kpi('مجموع سهم محاسبه‌شده',money(sum(rows,a=>a.amount)),'blue','wallet','بر اساس قوانین فعال هنگام فروش')}${kpi('در انتظار انتقال',money(pending),'orange','calendar','هنوز تأیید نشده')}${kpi('انتقال تأییدشده',money(done),'green','profit','توسط خودت علامت‌گذاری شده')}${kpi('تعداد سهم‌ها',new Intl.NumberFormat('fa-IR').format(rows.length),'red','box','به تفکیک هر کارت در هر فاکتور')}</div><div class="panel"><div class="panel-head"><h3>ریز سهم هر فروش</h3><span class="tiny">مبالغ به تومان</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>مقصد / کارت</th><th>تاریخ فروش</th><th>مبنای محاسبه</th><th>درصد</th><th>مبلغ سهم</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a.cardName)}</b><div class="tiny">${esc(a.purpose)}</div></td><td>${faDate(a.saleDate)}</td><td>${a.basis==='sales'?'کل مبلغ فروش':'سود ناخالص'}</td><td>${new Intl.NumberFormat('fa-IR').format(a.percent)}٪</td><td><b>${money(a.amount)}</b></td><td><span class="status ${a.transferred?'good':'warn'}">${a.transferred?'انتقال تأیید شد':'در انتظار انتقال'}</span></td><td>${a.transferred?`<span class="tiny">${faDate(a.transferredAt)}</span>`:`<button class="btn btn-primary btn-small" data-transfer="${a.saleId}:${a.cardId}">تأیید انتقال</button>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>هنوز سهمی برای کارت‌ها محاسبه نشده</strong>ابتدا کارت و درصد تخصیص تعریف کن، سپس فروش ثبت کن.</div>`}</div>`}
function reportsView(){const ms=db.sales.filter(s=>isThisMonth(s.date)),me=db.expenses.filter(e=>isThisMonth(e.date));const gross=totalSales(ms),cost=totalCost(ms),profit=totalProfit(ms),expenses=totalExpenses(me),net=profit-expenses;const cats={};me.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);return `${pageHead('گزارش سود و زیان','نمای مالی ماه جاری بر اساس فاکتورهای فروش، بهای خرید کالا و هزینه‌های ثبت‌شده.')}<div class="grid report-cards"><div class="report-card"><small>کل فروش ماه</small><strong>${money(gross)}</strong></div><div class="report-card"><small>بهای تمام‌شده کالای فروخته‌شده</small><strong>${money(cost)}</strong></div><div class="report-card"><small>سود ناخالص</small><strong class="amount-positive">${money(profit)}</strong></div><div class="report-card"><small>هزینه‌های ثبت‌شده</small><strong class="amount-negative">${money(expenses)}</strong></div><div class="report-card"><small>سود / زیان پس از هزینه</small><strong style="color:${net>=0?'#15936d':'#d45b63'}">${money(net)}</strong></div><div class="report-card"><small>حاشیه سود ناخالص</small><strong>${new Intl.NumberFormat('fa-IR',{maximumFractionDigits:1}).format(gross?profit/gross*100:0)}٪</strong></div></div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><h3>صورت خلاصه عملکرد</h3><span>ماه جاری</span></div><table style="min-width:0"><tbody><tr><td>درآمد حاصل از فروش</td><td style="text-align:left"><b>${money(gross)}</b></td></tr><tr><td>منهای بهای تمام‌شده کالا</td><td style="text-align:left" class="amount-negative">${money(cost)}</td></tr><tr><td><b>سود ناخالص</b></td><td style="text-align:left" class="amount-positive"><b>${money(profit)}</b></td></tr><tr><td>منهای هزینه‌های جاری</td><td style="text-align:left" class="amount-negative">${money(expenses)}</td></tr><tr><td><b>سود / زیان خالص</b></td><td style="text-align:left"><b>${money(net)}</b></td></tr></tbody></table></section><section class="panel"><div class="panel-head"><h3>ترکیب هزینه‌ها</h3></div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><b>${esc(cat)}</b><span>${money(val)}</span></div><div class="rule-bar"><span style="width:${expenses?val/expenses*100:0}%;background:#e9a04a"></span></div></div>`).join(''):`<div class="empty">هزینه‌ای در این ماه ثبت نشده است.</div>`}</section></div><div class="hint">سود خالص این گزارش = سود ناخالص فروش‌های این ماه − هزینه‌هایی که در همین ماه ثبت کرده‌ای. برداشت شخصی، مالیات، بدهی یا هزینه‌های ثبت‌نشده در محاسبه نمی‌آیند. این گزارش جایگزین حسابداری رسمی و مالیاتی نیست.</div>`}
function settingsView(){return `${pageHead('تنظیمات و پشتیبان‌گیری','از تمام اطلاعات فروشت یک فایل JSON بگیر و هر زمان لازم شد آن را بازیابی کن.')}<div class="panel settings-box"><div class="settings-row"><div><b>نام فروش</b><p>عنوانی که در نسخه فعلی استفاده می‌شود.</p></div><button class="btn btn-soft btn-small" data-action="business-name">ویرایش نام</button></div><div class="settings-row"><div><b>دریافت فایل پشتیبان JSON</b><p>شامل کالاها و موجودی، فروش‌ها، خریدها، هزینه‌ها، کارت‌ها، قوانین تقسیم پول و تنظیمات است.</p></div><button class="btn btn-primary btn-small" data-action="export">دانلود فایل پشتیبان</button></div><div class="settings-row"><div><b>بارگذاری و بازیابی فایل پشتیبان</b><p>فایل JSON قبلی را انتخاب کن. قبل از جایگزینی اطلاعات فعلی، از تو تأیید گرفته می‌شود.</p></div><div class="backup-actions"><button class="btn btn-soft btn-small" type="button" data-action="import">انتخاب فایل JSON</button><input id="importFile" type="file" accept=".json,application/json" class="hide"><span class="tiny">فرمت مجاز: JSON</span></div></div><div class="settings-row"><div><b>پاک‌کردن همه اطلاعات</b><p>این کار همه داده‌های ثبت‌شده در این مرورگر را حذف می‌کند و قابل بازگشت نیست.</p></div><button class="btn btn-danger btn-small" data-action="reset">پاک‌کردن اطلاعات</button></div></div><div class="hint" style="max-width:780px;margin-top:14px">پیشنهاد: بعد از ثبت فروش‌ها یا خریدهای مهم، فایل پشتیبان بگیر و آن را در یک پوشه امن یا فلش نگه دار. هنگام بازیابی، اطلاعات فعلی این مرورگر با محتوای فایل پشتیبان جایگزین می‌شود.</div><div class="hint" style="max-width:780px;margin-top:10px">این نسخه اطلاعات را روی همین مرورگر و دستگاه ذخیره می‌کند؛ فایل JSON برای انتقال اطلاعات به دستگاه دیگر یا نگهداری نسخه پشتیبان است.</div>`}
function openModal(title,body,submit,wide=false){modalSubmit=submit;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${wide?'wide':''}"><div class="modal-head"><h3>${title}</h3><button class="modal-close" id="modalClose">×</button></div><form id="activeForm"><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-primary" type="submit">ثبت اطلاعات</button><button class="btn btn-soft" type="button" id="modalCancel">انصراف</button></div></form></div></div>`;document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.getElementById('activeForm').addEventListener('submit',e=>{e.preventDefault();if(modalSubmit)modalSubmit(new FormData(e.target),e.target)});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalSubmit=null}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function productOptions(selected=''){return db.products.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} — موجودی: ${new Intl.NumberFormat('fa-IR').format(p.stock)} ${esc(p.unit)}</option>`).join('')}
function productModal(p=null){const editing=!!p;openModal(editing?'ویرایش کالا':'تعریف کالای جدید',`<div class="form-grid"><div class="field full"><label>نام کالا</label><input name="name" required maxlength="80" placeholder="مثلاً کبریت معمولی" value="${esc(p?.name||'')}"></div><div class="field"><label>واحد شمارش</label><select name="unit"><option ${p?.unit==='بسته'?'selected':''}>بسته</option><option ${p?.unit==='کارتن'?'selected':''}>کارتن</option><option ${p?.unit==='عدد'?'selected':''}>عدد</option><option ${p?.unit==='جعبه'?'selected':''}>جعبه</option><option ${p?.unit==='کیلوگرم'?'selected':''}>کیلوگرم</option></select></div><div class="field"><label>موجودی فعلی</label><input name="stock" type="number" min="0" step="any" required value="${p?.stock??0}"></div><div class="field"><label>میانگین بهای خرید هر واحد (تومان)</label><input name="costPrice" type="number" min="0" required value="${p?.costPrice??0}"></div><div class="field"><label>قیمت فروش هر واحد (تومان)</label><input name="sellPrice" type="number" min="0" required value="${p?.sellPrice??0}"></div><div class="field full"><label>حد هشدار کمبود موجودی</label><input name="minStock" type="number" min="0" value="${p?.minStock??5}"></div></div><div class="hint" style="margin-top:14px">برای مثال اگر خریدت کارتنی و فروشت بسته‌ای است، فعلاً یک واحد ثابت برای کالا انتخاب کن. در نسخه بعدی می‌توانیم تبدیل کارتن به بسته را هم اضافه کنیم.</div>`,fd=>{const data={name:fd.get('name').trim(),unit:fd.get('unit'),stock:num(fd.get('stock')),costPrice:num(fd.get('costPrice')),sellPrice:num(fd.get('sellPrice')),minStock:num(fd.get('minStock'))};if(!data.name){toast('نام کالا را وارد کن');return}if(editing)Object.assign(p,data);else db.products.push({id:uid(),...data});save();closeModal();render();toast(editing?'کالا ویرایش شد':'کالا اضافه شد')});}
function addSaleLine(container,selected=''){const div=document.createElement('div');div.className='sale-line';div.innerHTML=`<div class="field"><label>کالا</label><select class="line-product" required><option value="">انتخاب کالا</option>${productOptions(selected)}</select></div><div class="field"><label>تعداد</label><input class="line-qty" type="number" min="0.01" step="any" value="1" required></div><div class="field"><label>قیمت فروش واحد</label><input class="line-price" type="number" min="0" value="0" required></div><button type="button" class="remove-line" title="حذف ردیف">×</button>`;container.appendChild(div);const select=div.querySelector('.line-product');select.addEventListener('change',()=>{const p=getProduct(select.value);div.querySelector('.line-price').value=p?p.sellPrice:0;div.querySelector('.line-qty').max=p?p.stock:0});div.querySelector('.remove-line').onclick=()=>{if(container.children.length>1)div.remove();else toast('حداقل یک ردیف کالا لازم است')};}
function saleModal(){if(!db.products.length){toast('ابتدا از بخش انبار کالا تعریف کن');setView('inventory');return}const cardsNote=db.cards.length?`${db.cards.length} قانون تخصیص فعال است.`:'هنوز قانون تقسیم پول تعریف نکرده‌ای.';openModal('ثبت فروش جدید',`<div class="field"><label>اقلام این فاکتور</label></div><div class="line-items" id="saleLines"></div><button type="button" class="btn btn-soft btn-small" id="addSaleLine">${icon('plus')}افزودن ردیف کالا</button><div class="form-grid" style="margin-top:16px"><div class="field"><label>روش پرداخت</label><select name="payment"><option>نقدی</option><option>کارت‌خوان</option><option>کارت به کارت</option><option>نسیه</option><option>ترکیبی</option></select></div><div class="field"><label>تاریخ فروش</label><input name="date" type="datetime-local" value="${localDateTimeValue()}" required></div><div class="field full"><label>توضیحات (اختیاری)</label><input name="note" placeholder="نام مشتری یا توضیح کوتاه"></div></div><div class="summary-strip"><span>مجموع این فاکتور</span><strong id="saleTotalPreview">۰ تومان</strong></div><div class="hint" style="margin-top:12px">${cardsNote} پس از ثبت فاکتور، موجودی کالا کم و سهم کارت‌ها طبق درصد تعریف‌شده محاسبه می‌شود. موجودی قبل از ثبت بررسی خواهد شد.</div>`,(fd,form)=>{const items=[...form.querySelectorAll('.sale-line')].map(row=>{const p=getProduct(row.querySelector('.line-product').value);return p?{product:p,qty:num(row.querySelector('.line-qty').value),price:num(row.querySelector('.line-price').value)}:null}).filter(Boolean);if(!items.length){toast('حداقل یک کالا انتخاب کن');return}for(const it of items){if(it.qty<=0||it.qty>it.product.stock){toast(`موجودی ${it.product.name} کافی نیست`);return}}let total=0,cost=0;const saleItems=items.map(it=>{let lineTotal=it.qty*it.price,lineCost=it.qty*it.product.costPrice;total+=lineTotal;cost+=lineCost;it.product.stock-=it.qty;return{productId:it.product.id,name:it.product.name,qty:it.qty,unit:it.product.unit,price:it.price,costPrice:it.product.costPrice,total:lineTotal,cost:lineCost}});const profit=total-cost;const date=fd.get('date')?new Date(fd.get('date')).toISOString():new Date().toISOString();const sale={id:uid(),date,items:saleItems,total,cost,profit,payment:fd.get('payment'),note:fd.get('note'),allocations:makeAllocations(total,profit)};db.sales.push(sale);save();closeModal();render();toast('فروش ثبت شد؛ انبار و سهم کارت‌ها به‌روزرسانی شد')},true);const lines=document.getElementById('saleLines');addSaleLine(lines);document.getElementById('addSaleLine').onclick=()=>addSaleLine(lines);const update=()=>{const total=[...lines.querySelectorAll('.sale-line')].reduce((a,r)=>a+num(r.querySelector('.line-qty').value)*num(r.querySelector('.line-price').value),0);document.getElementById('saleTotalPreview').textContent=money(total)};lines.addEventListener('input',update);lines.addEventListener('change',update);}
function purchaseModal(){if(!db.products.length){toast('ابتدا کالا تعریف کن');setView('inventory');return}openModal('ثبت خرید کالا',`<div class="form-grid"><div class="field full"><label>کالا</label><select name="productId" required><option value="">انتخاب کالا</option>${productOptions()}</select></div><div class="field"><label>تعداد خرید</label><input name="qty" type="number" min="0.01" step="any" required value="1"></div><div class="field"><label>قیمت خرید هر واحد (تومان)</label><input name="unitCost" type="number" min="0" required></div><div class="field full"><label>تاریخ خرید</label><input name="date" type="datetime-local" value="${localDateTimeValue()}"></div><div class="field full"><label>توضیحات / فروشنده</label><input name="note" placeholder="اختیاری"></div></div><div class="hint" style="margin-top:14px">با ثبت خرید، موجودی کالا افزایش پیدا می‌کند و میانگین بهای خرید آن با روش میانگین موزون به‌روزرسانی می‌شود.</div>`,fd=>{const p=getProduct(fd.get('productId')),qty=num(fd.get('qty')),unitCost=num(fd.get('unitCost'));if(!p||qty<=0){toast('اطلاعات خرید کامل نیست');return}const oldValue=p.stock*p.costPrice;p.stock+=qty;p.costPrice=p.stock?(oldValue+qty*unitCost)/p.stock:unitCost;const date=fd.get('date')?new Date(fd.get('date')).toISOString():new Date().toISOString();db.purchases.push({id:uid(),productId:p.id,productName:p.name,unit:p.unit,qty,unitCost,total:qty*unitCost,date,note:fd.get('note')});save();closeModal();render();toast('خرید ثبت و موجودی انبار به‌روزرسانی شد')});}
function expenseModal(){openModal('ثبت هزینه جدید',`<div class="form-grid"><div class="field"><label>دسته هزینه</label><select name="category"><option>حمل‌ونقل</option><option>اجاره</option><option>حقوق و دستمزد</option><option>بسته‌بندی</option><option>قبوض و خدمات</option><option>تعمیرات</option><option>برداشت شخصی</option><option>سایر</option></select></div><div class="field"><label>مبلغ (تومان)</label><input name="amount" type="number" min="1" required placeholder="مثلاً 250000"></div><div class="field"><label>تاریخ</label><input name="date" type="datetime-local" value="${localDateTimeValue()}"></div><div class="field"><label>توضیحات</label><input name="note" placeholder="اختیاری"></div></div>`,fd=>{const amount=num(fd.get('amount'));if(amount<=0){toast('مبلغ باید بیشتر از صفر باشد');return}db.expenses.push({id:uid(),category:fd.get('category'),amount,date:fd.get('date')?new Date(fd.get('date')).toISOString():new Date().toISOString(),note:fd.get('note')});save();closeModal();render();toast('هزینه ثبت شد')});}
function cardModal(c=null){const editing=!!c;openModal(editing?'ویرایش قانون تخصیص':'تعریف کارت و مقصد جدید',`<div class="form-grid"><div class="field"><label>نام کارت / مقصد</label><input name="name" required maxlength="50" placeholder="مثلاً کارت پس‌انداز" value="${esc(c?.name||'')}"></div><div class="field"><label>کاربرد این کارت</label><input name="purpose" required maxlength="70" placeholder="مثلاً پس‌انداز و سرمایه آینده" value="${esc(c?.purpose||'')}"></div><div class="field"><label>مبنای محاسبه سهم</label><select name="basis"><option value="sales" ${c?.basis!=='profit'?'selected':''}>درصد از کل مبلغ فروش</option><option value="profit" ${c?.basis==='profit'?'selected':''}>درصد از سود ناخالص فروش</option></select></div><div class="field"><label>درصد تخصیص</label><input name="percent" type="number" min="0.01" max="100" step="0.01" required value="${c?.percent??10}"></div></div><div class="hint" style="margin-top:14px">مجموع درصد کارت‌هایی که مبنای یکسان دارند نباید بیشتر از ۱۰۰٪ شود. قوانین جدید فقط روی فروش‌هایی اعمال می‌شوند که از این به بعد ثبت می‌کنی؛ سوابق قبلی تغییر نمی‌کنند.</div>`,fd=>{const basis=fd.get('basis'),percent=num(fd.get('percent'));if(percent<=0||allocationPercents(basis,c?.id)>100-percent+0.00001){toast('مجموع درصدهای این مبنا از ۱۰۰٪ بیشتر می‌شود');return}const data={name:fd.get('name').trim(),purpose:fd.get('purpose').trim(),basis,percent};if(!data.name||!data.purpose){toast('نام و کاربرد کارت را وارد کن');return}if(editing)Object.assign(c,data);else db.cards.push({id:uid(),...data});save();closeModal();render();toast(editing?'قانون کارت ویرایش شد':'کارت و قانون تخصیص اضافه شد')});}
function bindViewEvents(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='new-sale')saleModal();if(a==='new-product')productModal();if(a==='new-purchase')purchaseModal();if(a==='new-expense')expenseModal();if(a==='new-card')cardModal();if(a==='export')exportData();if(a==='import')document.getElementById('importFile')?.click();if(a==='reset')resetData();if(a==='business-name')businessNameModal()}));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));const search=document.getElementById('tableSearch');if(search)search.addEventListener('input',e=>{searchTerm=e.target.value;const pos=e.target.selectionStart;render();const again=document.getElementById('tableSearch');if(again){again.focus();again.setSelectionRange(pos,pos)}});document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productModal(getProduct(b.dataset.editProduct)));document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteProduct;if(db.sales.some(s=>s.items.some(i=>i.productId===id))||db.purchases.some(p=>p.productId===id)){toast('این کالا سابقه خرید یا فروش دارد؛ حذف آن مجاز نیست');return}if(confirm('این کالا حذف شود؟')){db.products=db.products.filter(p=>p.id!==id);save();render();toast('کالا حذف شد')}});document.querySelectorAll('[data-delete-sale]').forEach(b=>b.onclick=()=>{const s=db.sales.find(x=>x.id===b.dataset.deleteSale);if(!s)return;if(confirm('فاکتور حذف شود؟ موجودی کالاها به انبار برمی‌گردد و سهم‌های این فاکتور حذف می‌شوند.')){s.items.forEach(i=>{const p=getProduct(i.productId);if(p)p.stock+=i.qty});db.sales=db.sales.filter(x=>x.id!==s.id);save();render();toast('فاکتور حذف و موجودی اصلاح شد')}});document.querySelectorAll('[data-delete-expense]').forEach(b=>b.onclick=()=>{if(confirm('این هزینه حذف شود؟')){db.expenses=db.expenses.filter(e=>e.id!==b.dataset.deleteExpense);save();render();toast('هزینه حذف شد')}});document.querySelectorAll('[data-edit-card]').forEach(b=>b.onclick=()=>cardModal(db.cards.find(c=>c.id===b.dataset.editCard)));document.querySelectorAll('[data-delete-card]').forEach(b=>b.onclick=()=>{const c=db.cards.find(x=>x.id===b.dataset.deleteCard);if(c&&confirm(`قانون «${c.name}» برای فروش‌های بعدی حذف شود؟ سهم‌های فروش‌های قبلی تغییر نمی‌کنند.`)){db.cards=db.cards.filter(x=>x.id!==c.id);save();render();toast('قانون تخصیص حذف شد')}});document.querySelectorAll('[data-transfer]').forEach(b=>b.onclick=()=>{const [saleId,cardId]=b.dataset.transfer.split(':');const s=db.sales.find(x=>x.id===saleId),a=s?.allocations?.find(x=>x.cardId===cardId);if(a){a.transferred=true;a.transferredAt=new Date().toISOString();save();render();toast('انتقال به‌عنوان انجام‌شده ثبت شد')}});const importFile=document.getElementById('importFile');if(importFile)importFile.onchange=importData;}
function exportData(){
 const payload={app:'match-business-manager',backupVersion:1,exportedAt:new Date().toISOString(),data:db};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='backup-match-business-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast('فایل پشتیبان JSON دانلود شد');
}
function importData(e){
 const input=e.target,file=input.files&&input.files[0];if(!file)return;
 if(file.size>15*1024*1024){toast('حجم فایل پشتیبان بیشتر از ۱۵ مگابایت است');input.value='';return;}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(String(reader.result||''));
   const source=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed; // پشتیبانی از فایل‌های قدیمی
   if(!source||!Array.isArray(source.products)||!Array.isArray(source.sales)||!Array.isArray(source.cards))throw new Error('ساختار فایل معتبر نیست');
   if(source.purchases!==undefined&&!Array.isArray(source.purchases))throw new Error('فهرست خریدها معتبر نیست');
   if(source.expenses!==undefined&&!Array.isArray(source.expenses))throw new Error('فهرست هزینه‌ها معتبر نیست');
   const defaults=newDB();
   const restored={...defaults,...source,
    products:source.products,
    sales:source.sales,
    purchases:Array.isArray(source.purchases)?source.purchases:[],
    expenses:Array.isArray(source.expenses)?source.expenses:[],
    cards:source.cards,
    settings:{...defaults.settings,...(source.settings&&typeof source.settings==='object'?source.settings:{})}
   };
   const summary=`کالا: ${restored.products.length} | فروش: ${restored.sales.length} | خرید: ${restored.purchases.length} | هزینه: ${restored.expenses.length}`;
   if(confirm(`اطلاعات فعلی با فایل پشتیبان جایگزین شود؟\n\n${summary}\n\nاین کار روی اطلاعات فعلی بازنویسی می‌کند.`)){
    db=restored;save();render();toast('اطلاعات فایل پشتیبان با موفقیت بازیابی شد');
   }
  }catch(err){toast('فایل JSON معتبرِ پشتیبان این سایت نیست');}
  finally{input.value='';}
 };
 reader.onerror=()=>{toast('خواندن فایل با خطا مواجه شد');input.value='';};
 reader.readAsText(file,'UTF-8');
}
function resetData(){if(confirm('همه اطلاعات شامل کالاها، فروش‌ها، کارت‌ها و هزینه‌ها حذف شود؟ این کار قابل بازگشت نیست.')){db=newDB();save();setView('dashboard');toast('اطلاعات پاک شد')}}
function businessNameModal(){openModal('نام فروش',`<div class="field"><label>نامی که در پنل نمایش داده شود</label><input name="name" value="${esc(db.settings.businessName||'مدیریت فروش')}" required></div>`,fd=>{db.settings.businessName=fd.get('name').trim();save();closeModal();toast('نام ذخیره شد')})}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('quickSale').onclick=saleModal;document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('todayText').textContent=new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());render();
</script>
